[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pylontech-rs485"
dynamic = ["version"]
description = "Read Pylontech LiFePO4 batteries over RS485 (Pylontech ASCII protocol), standard library only"
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.scripts]
pylontech-rs485 = "pylontech_rs485.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pylontech_rs485.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
